# Game server on Fly.io, Singapore. Secrets (SUPABASE_URL, SUPABASE_ANON_KEY, ALLOWED_ORIGINS) are set with
# `fly secrets set`, never written here. See docs/deploy.md.
app = "badminton-game-server" # must be unique on Fly: change it if `fly launch` says the name is taken
primary_region = "sin"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # sleeps when nobody is connected; an open websocket keeps it awake
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
